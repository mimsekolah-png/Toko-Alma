  <rect x="220" y="280" width="72" height="120" rx="8" fill="#2563eb" />
  <rect x="146" y="250" width="56" height="60" rx="6" fill="#e0e7ff" />
  <rect x="310" y="250" width="56" height="60" rx="6" fill="#e0e7ff" />
  
