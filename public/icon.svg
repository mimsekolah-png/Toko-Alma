      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Store / Toko Canopy -->
  <path d="M96 200 L416 200 L386 140 L126 140 Z" fill="url(#roofGrad)" />
  <!-- Canopy scallops -->
  <path d="M96 200 Q128 230 160 200 Q192 230 224 200 Q256 230 288 200 Q320 230 352 200 Q384 230 416 200 L416 190 L96 190 Z" fill="#f59e0b" />
  
