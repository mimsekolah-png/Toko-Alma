<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-Jurnal Toko Alma</title>
    <meta name="description" content="Aplikasi pencatatan jurnal harian kas, piutang, titipan, rekap bulanan, serta transaksi pembayaran cash lengkap dengan nota kasir Toko Alma." />
    <meta property="og:title" content="E-Jurnal Toko Alma" />
    <meta property="og:description" content="Aplikasi pencatatan jurnal harian kas, piutang, titipan, rekap bulanan, serta transaksi pembayaran cash lengkap dengan nota kasir Toko Alma." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Toko Alma" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
  </head>
  <body>
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #f0f2f5; font-family: system-ui, -apple-system, sans-serif; padding: 16px;">
        <div style="background: white; padding: 28px 24px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); text-align: center; max-width: 320px; width: 100%; border: 1px solid #e2e8f0;">
          <div style="width: 56px; height: 56px; background: linear-gradient(135deg, #2563eb, #1d4ed8); border-radius: 16px; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; color: white; font-size: 26px; box-shadow: 0 8px 16px rgba(37,99,235,0.25);">
            🏪
          </div>
          <h2 style="font-size: 17px; font-weight: 700; color: #1e293b; margin: 0 0 6px 0;">E-Jurnal Toko Alma</h2>
          <p id="splash-status" style="font-size: 12px; color: #64748b; margin: 0 0 16px 0;">Menghubungkan kasir & data realtime...</p>
          <div style="width: 100%; height: 4px; background: #e2e8f0; border-radius: 9999px; overflow: hidden; position: relative;">
            <div style="width: 40%; height: 100%; background: #2563eb; border-radius: 9999px; animation: almaPulse 1.2s infinite ease-in-out;"></div>
          </div>
          <p id="splash-hint" style="font-size: 10px; color: #94a3b8; margin: 14px 0 0 0; line-height: 1.4;">
            ⚡ Tip: Pasang di Layar Utama HP agar terbuka instan 0 detik!
          </p>
        </div>
        <script>
          (function() {
            setTimeout(function() {
              var el = document.getElementById('splash-status');
              if (el) el.textContent = 'Membangunkan server cloud...';
            }, 2500);
            setTimeout(function() {
              var el = document.getElementById('splash-status');
              if (el) el.textContent = 'Menyiapkan modul database & kasir...';
            }, 6000);
          })();
        </script>
        <style>
          @keyframes almaPulse {
            0% { transform: translateX(-100%); }
            50% { transform: translateX(100%); }
            100% { transform: translateX(250%); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
